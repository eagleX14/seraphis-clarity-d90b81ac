name: Deploy static content to Pages
# WIF verification trigger

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Detect job posting changes
        id: job_changes
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          before="${{ github.event.before }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            changed=true
          else
            if git diff --name-only "$before" "${{ github.sha }}" | grep -Eq '^(src/data/careers\.ts|src/pages/CareerDetail\.tsx|public/sitemap\.xml|scripts/google-indexing\.mjs|scripts/indexnow-jobs\.mjs|public/97cbe91b1338e97ed4a45e81d955835f\.txt|\.github/workflows/deploy\.yml)$'; then
              changed=true
            fi

            if git cat-file -e "$before:public/sitemap.xml" 2>/dev/null; then
              git show "$before:public/sitemap.xml" > /tmp/previous-sitemap.xml
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (keyless)
        id: google_auth
        if: steps.job_changes.outputs.changed == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT_EMAIL != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/indexing

      - name: Notify Google JobPosting Indexing API
        if: steps.google_auth.outcome == 'success'
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          CURRENT_SITEMAP: public/sitemap.xml
          PREVIOUS_SITEMAP: /tmp/previous-sitemap.xml
        run: node scripts/google-indexing.mjs

      - name: Notify IndexNow search engines
        if: steps.job_changes.outputs.changed == 'true'
        env:
          CURRENT_SITEMAP: public/sitemap.xml
          PREVIOUS_SITEMAP: /tmp/previous-sitemap.xml
        run: node scripts/indexnow-jobs.mjs
