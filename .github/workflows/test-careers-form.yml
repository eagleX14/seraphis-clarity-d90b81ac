# Retest native form submission after deployment
name: Test Careers Application Form

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/test-careers-form.yml'

permissions:
  contents: read

jobs:
  browser-submit-demo-application:
    runs-on: ubuntu-latest
    steps:
      - name: Create demo CV attachment
        run: |
          cat > demo-cv.doc <<'EOF'
          {\rtf1\ansi\deff0
          {\fonttbl{\f0 Arial;}}
          \f0\fs24
          DEMO APPLICATION - FORM TEST ONLY\par
          Candidate: Demo Test Applicant\par
          Role: Full Stack Web Developer\par
          Purpose: Verify Seraphis careers application delivery and CV attachment handling.\par
          This is not a real employment application.\par
          }
          EOF

      - name: Install browser automation library
        run: npm install puppeteer-core@latest --no-save --ignore-scripts

      - name: Wait for production deployment
        run: sleep 60

      - name: Submit through the live careers page
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using browser: $CHROME_PATH"
          cat > test-careers-form.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          const page = await browser.newPage();
          page.on('console', msg => console.log('BROWSER_CONSOLE:', msg.text()));
          page.on('response', async response => {
            if (response.url().includes('formsubmit.co')) {
              console.log('FORMSUBMIT_RESPONSE:', response.status(), response.url());
              try {
                const body = await response.text();
                console.log('FORMSUBMIT_BODY:', body.slice(0, 1000));
              } catch {}
            }
          });

          const url = 'https://seraphis-it.com/careers/full-stack-web-developer';
          await page.goto(url, { waitUntil: 'networkidle2', timeout: 90000 });
          console.log('PAGE_LOADED:', page.url());

          await page.type('[name="First Name"]', 'Demo');
          await page.type('[name="Last Name"]', 'Test Applicant');
          await page.type('[name="Email"]', 'demo-applicant@example.com');
          await page.type('[name="Mobile Number"]', '+27 00 000 0000');
          await page.type('[name="Current Location"]', 'Gauteng / Johannesburg');
          await page.type('[name="Years of Relevant Experience"]', '5 years - demo value');
          await page.select('[name="Current Availability"]', 'Immediately available');
          await page.type('[name="Notice Period"]', 'Immediate - demo value');
          await page.type('[name="Expected Rate / Compensation"]', 'Demo test only');
          await page.select('[name="Right to Work in South Africa"]', 'Other — explain in the message below');
          await page.type('[name="Additional Message"]', 'DEMO APPLICATION ONLY. This submission is a live form test for Seraphis. Please disregard as a candidate application.');

          const cv = await page.$('input[name="CV / Resume"]');
          if (!cv) throw new Error('CV input was not found');
          await cv.uploadFile('demo-cv.doc');

          await page.click('input[name="Recruitment Consent"]');
          await page.click('input[name="Information Accuracy Confirmation"]');

          await page.click('button[type="submit"]');

          try {
            await page.waitForFunction(
              () => window.location.pathname.includes('/careers/application-received'),
              { timeout: 90000 }
            );
          } catch (error) {
            const alertText = await page.$eval('[role="alert"]', el => el.textContent).catch(() => '');
            console.log('FORM_ALERT:', alertText);
            console.log('CURRENT_URL:', page.url());
            throw error;
          }

          console.log('APPLICATION_SUBMITTED_SUCCESSFULLY');
          console.log('SUCCESS_URL:', page.url());
          await browser.close();
          EOF
          CHROME_PATH="$CHROME_PATH" node ./test-careers-form.mjs
